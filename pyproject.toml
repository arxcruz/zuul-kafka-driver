[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zuul-kafka-driver"
version = "0.1.0"
description = "Out-of-tree Zuul driver that triggers pipelines from Kafka messages"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3",
]

[project.optional-dependencies]
test = ["pytest"]

# Any package can register additional Zuul drivers in this group; the
# hook in zuul_kafka/_hook.py loads every entry point it finds here.
[project.entry-points."zuul.drivers"]
kafka = "zuul_kafka.driver:KafkaDriver"

[tool.hatch.build.targets.wheel]
packages = ["zuul_kafka"]

# The .pth file is executed by the interpreter at startup and installs
# the import hook that registers external drivers with Zuul.
[tool.hatch.build.targets.wheel.force-include]
"zuul_kafka_driver.pth" = "zuul_kafka_driver.pth"

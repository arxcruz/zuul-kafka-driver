[zookeeper]
hosts=zk:2281
tls_cert=/var/certs/certs/client.pem
tls_key=/var/certs/keys/clientkey.pem
tls_ca=/var/certs/certs/cacert.pem

[keystore]
password=secret

[scheduler]
tenant_config=/etc/zuul/main.yaml

[database]
dburi=mariadb+pymysql://zuul:secret@mysql/zuul

[merger]
git_user_email=zuul@example.com
git_user_name=Zuul

[executor]
variables=/etc/zuul/site-variables.yaml
# zuul-web streams live job output from the executor by this name.
hostname=executor
private_key_file=/var/lib/zuul/ssh/id_rsa
default_username=zuul
trusted_rw_paths=/srv/static/logs
# The demo VM is small and emulated; don't let the load governors
# stop the executor from accepting jobs.
load_multiplier=100
min_avail_mem=0
min_avail_hdd=0
min_avail_inodes=0

[web]
listen_address=0.0.0.0
port=9000
root=http://localhost:9000

# Local bare repos shared through the "git" volume stand in for a code
# review system.
[connection git]
driver=git
baseurl=/srv/git
canonical_hostname=git.local

[connection kafka]
driver=kafka
bootstrap_servers=kafka:9092
topics=zuul-triggers
group_id=zuul
auto_offset_reset=earliest
